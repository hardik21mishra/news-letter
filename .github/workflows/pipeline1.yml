name: Pipeline 1 - Fetch and export articles

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline1:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_SSL_CA: ${{ secrets.MYSQL_SSL_CA }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set default MySQL port
        shell: bash
        run: |
          export MYSQL_PORT="${MYSQL_PORT:-3306}"
          echo "MYSQL_PORT=${MYSQL_PORT}" >> "$GITHUB_ENV"

      - name: Write Google service account credentials file
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            python -c 'import os, pathlib; content = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", ""); assert content, "GOOGLE_SERVICE_ACCOUNT_JSON is empty"; pathlib.Path("credentials.json").write_text(content, encoding="utf-8")'
          fi

      - name: Run pipeline 1
        run: python run_pipeline1.py
